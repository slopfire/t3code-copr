name: Build T3 Code nightly with Command Code and Oh My Pi

# Builds the upstream nightly from source with `patches/prs/` applied,
# packages the resulting x86_64 AppImage as `t3code-prs-nightly`, and submits
# it to the same COPR project as the plain nightly. The patches carry the
# ported providers: the Command Code provider and the bundled Oh My Pi ACP
# registry entry, both written against the orchestration interfaces that
# upstream main has carried since it merged the orchestrator (pull request
# #2829) on 2026-10-02. Upstream carries neither integration: the provider
# pull requests (#10861, #11973) and the ACP Registry entry for Oh My Pi are
# still pending, so this flavor layers them as local patches. It obsoletes the
# `t3code-v2-prs-nightly` and `t3code-v2-nightly` names, which the orchestrator
# merge made redundant.

on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Build even if this nightly tag and patch set were already recorded
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: t3code-prs-nightly-copr
  cancel-in-progress: false

env:
  T3CODE_REPO: pingdotgg/t3code
  # Flavor selects the spec template (t3code-<flavor>-nightly), the desktop
  # entry, and the patch directory (patches/<flavor>).
  FLAVOR: prs
  # The public identifiers upstream bakes into official builds (see its
  # .env.example). Not secrets: they only enable T3 Connect against the public
  # production deployment, and without them the app builds with cloud disabled.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  resolve:
    name: Resolve the upstream nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      key: ${{ steps.release.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve versions
        id: release
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(./scripts/resolve-latest-nightly.sh)"
          version="${tag#v}"

          # The local patches ride on top of the nightly tree, so the key has
          # to move when they change; otherwise a fixed patch never rebuilds.
          layer_digest=none
          if compgen -G "patches/${FLAVOR}/*.patch" >/dev/null; then
            layer_digest="$(find "patches/${FLAVOR}" -type f -print0 | sort -z \
              | xargs -0 -r cat | sha256sum | cut -c1-12)"
          fi
          key="${tag}+p${layer_digest}"
          echo "Resolved upstream nightly: $tag"
          echo "Patch digest: p${layer_digest}"

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

          last="$(cat "packaging/${FLAVOR}/last-built-key" 2>/dev/null || true)"
          if [[ "$FORCE" == "true" || "$key" != "$last" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build (force=${FORCE} last=${last:-none})"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping; already recorded $key"
          fi

  build:
    name: Build the patched AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole object store has to be present: any later step that checks out
      # another revision (or a future layering step) reads blobs by object id,
      # and a sparse checkout's `--filter=blob:none` promisor fetch by object id
      # fails for revisions the tree does not carry.
      - name: Checkout upstream at the nightly tag
        uses: actions/checkout@v5
        with:
          repository: ${{ env.T3CODE_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      # This job checks out upstream, so the layer files that live in this
      # repository (patches/) are fetched by API rather than checked out into
      # the build tree.
      - name: Fetch the patch files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layers"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/\
            ${{ github.sha }}" \
            | tar --extract --gzip --strip-components=1 \
            --directory "$RUNNER_TEMP/layers"
          ls -R "$RUNNER_TEMP/layers/patches" 2>/dev/null || true

      - name: Confirm the checkout
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Checked out tag: ${TAG} at $(git rev-parse HEAD)"
          # A wrong ref would otherwise build a tree without the orchestrator
          # the ported patches are written against.
          test -f apps/server/src/orchestration-v2/ProviderAdapter.ts || {
            echo "::error::${TAG} is not the v2 orchestrator stack:"
            echo "::error::orchestration-v2/ProviderAdapter.ts is missing."
            exit 1
          }

      - name: Apply local patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/layers/patches/"${FLAVOR}"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::patches/${FLAVOR}/ carries no patches;"
            echo "::error::the flavor exists for them."
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Applying $(basename "${patch}")"
            if ! git apply --verbose "${patch}"; then
              echo "::error::Could not apply $(basename "${patch}");"
              echo "::error::the nightly changed the files it touches."
              echo "::error::Rebase the patch and refresh its context."
              exit 1
            fi
          done
          git --no-pager diff --stat

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev \
            pkg-config imagemagick

      - name: Install dependencies
        run: |
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      # The patches are the only part of this build upstream CI never sees, so
      # the focused tests of the adapters they touch run here before anything
      # is packaged.
      - name: Test the ported adapters
        working-directory: apps/server
        run: |
          set -euo pipefail
          tests=(
            src/orchestration-v2/Adapters/CommandCodeAdapterV2.test.ts
            src/provider/commandCodeNdjson.test.ts
            src/provider/commandCodeModels.test.ts
          )
          for test in "${tests[@]}"; do
            [[ -f "$test" ]] || {
              echo "::error::${test} is missing: the ported Command"
              echo "::error::Code patch did not apply."
              exit 1
            }
          done
          # The workspace binary matches this tree's vite-plus; the globally
          # installed vp version does not and fails every test file at import.
          vp_bin=../node_modules/.bin/vp
          [[ -x "$vp_bin" ]] || vp_bin=vp
          "$vp_bin" test run "${tests[@]}"

      - name: Align package versions
        run: |-
          node scripts/update-release-package-versions.ts \
            "${{ needs.resolve.outputs.version }}"

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Build Linux AppImage
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage" || {
            echo "No AppImage was produced." >&2
            exit 1
          }
          base="T3-Code-${{ needs.resolve.outputs.version }}-x86_64"
          install -Dm0755 "$appimage" "$RUNNER_TEMP/$base.AppImage"
          ls -l "$RUNNER_TEMP/$base.AppImage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: prs-appimage
          path: ${{ runner.temp }}/T3-Code-*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to COPR
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install RPM, release, and COPR tooling
        run: >-
          dnf --assumeyes install curl gh git jq rpm-build rpmdevtools copr-cli
      # The checkout is owned by the host user while run steps execute as a
      # different user inside the container, so `gh`'s internal git calls fail
      # without this.
      - name: Allow git access to the container-owned workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prs-appimage
          path: appimage

      # Archive the exact bytes the RPM carries before publishing anything that
      # claims to be built from them.
      - name: Archive the AppImage on a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="prs-nightly"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            title='T3 Code nightly AppImages'
            title="$title (with Command Code and Oh My Pi)"
            notes='Rolling prerelease holding the source-built AppImages'
            notes="$notes that the t3code-prs-nightly RPM repackages."
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "$title" --notes "$notes"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "appimage/T3-Code-${VERSION}-x86_64.AppImage" --clobber

      - name: Build source RPM
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # No pull requests are layered, so no positional number/sha pairs are
          # passed to build-layered-srpm.sh; the provenance file records the
          # local patches instead.
          ./scripts/build-layered-srpm.sh prs "$TAG" \
            appimage/T3-Code-*.AppImage

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 0700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

      - name: Submit source RPM to COPR
        env:
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$COPR_PROJECT"
          copr build "$COPR_PROJECT" rpmbuild/SRPMS/*.src.rpm

      - name: Record successful submission
        env:
          KEY: ${{ needs.resolve.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/record-last-built-key.sh "$FLAVOR" "$KEY"
