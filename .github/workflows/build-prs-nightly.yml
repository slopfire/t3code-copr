name: Build T3 Code + pull requests nightly

# Builds the upstream nightly from source with a set of upstream pull requests
# layered on top, packages the resulting x86_64 AppImage as `t3code-prs-nightly`,
# and submits it to the same COPR project as the plain nightly. The plain nightly
# repackages an official AppImage; this one has to compile, because no upstream
# artifact contains a pull request.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this nightly tag and pull request revisions were already recorded
        required: false
        default: false
        type: boolean
      pr_refs:
        description: Space separated upstream pull request refs to layer, in merge order
        required: false
        default: refs/pull/10861/head refs/pull/11973/head
        type: string

permissions:
  contents: write

concurrency:
  group: t3code-prs-nightly-copr
  cancel-in-progress: false

env:
  T3CODE_REPO: pingdotgg/t3code
  # Flavor selects the spec template (t3code-<flavor>-nightly), the desktop
  # entry, and the patch directory (patches/<flavor>).
  FLAVOR: prs
  # The layered pull requests, in merge order. A ref is `refs/pull/<number>/head`
  # and the number must be the pull request the AppImage is built from.
  PR_REFS: ${{ inputs.pr_refs || 'refs/pull/10861/head refs/pull/11973/head' }}
  # The public identifiers upstream bakes into official builds (see its
  # .env.example). Not secrets: they only enable T3 Connect against the public
  # production deployment, and without them the app builds with cloud disabled.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  resolve:
    name: Resolve the upstream nightly and the pull request revisions
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      # `10861:<sha> 11973:<sha>`, in merge order.
      pr_spec: ${{ steps.release.outputs.pr_spec }}
      key: ${{ steps.release.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve versions
        id: release
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(./scripts/resolve-latest-nightly.sh)"
          version="${tag#v}"

          pr_spec=""
          sha_key=""
          for ref in ${PR_REFS}; do
            number="${ref#refs/pull/}"
            number="${number%/head}"
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              echo "Unsupported pull request ref: ${ref}" >&2
              exit 1
            fi
            sha="$(gh api "repos/${T3CODE_REPO}/pulls/${number}" --jq '.head.sha')"
            test -n "$sha" || { echo "Could not resolve PR ${number}." >&2; exit 1; }
            pr_spec+="${pr_spec:+ }${number}:${sha}"
            sha_key+="+${sha}"
          done
          test -n "$pr_spec" || { echo "No pull requests to layer." >&2; exit 1; }

          # Local patches and conflict resolutions ride on top of the pull
          # requests, so the key has to move when they change; otherwise a fixed
          # patch or resolution never rebuilds. Only this flavor's own patch
          # directory and the resolutions of its pull requests count.
          layer_paths=()
          [[ -d "patches/${FLAVOR}" ]] && layer_paths+=("patches/${FLAVOR}")
          for entry in ${pr_spec}; do
            number="${entry%%:*}"
            [[ -d "resolutions/${number}" ]] && layer_paths+=("resolutions/${number}")
          done
          if [[ ${#layer_paths[@]} -eq 0 ]]; then
            layer_digest="none"
          else
            layer_digest="$(find "${layer_paths[@]}" -type f -print0 | sort -z \
              | xargs -0 -r cat | sha256sum | cut -c1-12)"
          fi
          key="${tag}${sha_key}+p${layer_digest}"
          echo "Resolved upstream nightly: $tag"
          echo "Pull requests: ${pr_spec}"
          echo "Layer digest: p${layer_digest}"

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'pr_spec=%s\n' "$pr_spec" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

          last="$(cat "packaging/${FLAVOR}/last-built-key" 2>/dev/null || true)"
          if [[ "$FORCE" == "true" || "$key" != "$last" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build (force=${FORCE} last=${last:-none})"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping; already recorded $key"
          fi

  build:
    name: Build the layered AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole object store has to be present: the merge reads the merge-base
      # blobs, and a sparse checkout makes actions/checkout fetch with
      # `--filter=blob:none`, whose promisor fetch by object id fails for
      # revisions the pull requests carry.
      - name: Checkout upstream at the nightly tag
        uses: actions/checkout@v5
        with:
          repository: ${{ env.T3CODE_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      # This job checks out upstream, so the layer files that live in this
      # repository (patches/, resolutions/) are fetched by API rather than
      # checked out into the build tree.
      - name: Fetch the layer files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layers"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${{ github.sha }}" \
            | tar --extract --gzip --strip-components=1 --directory "$RUNNER_TEMP/layers"
          ls -R "$RUNNER_TEMP/layers/patches" "$RUNNER_TEMP/layers/resolutions" 2>/dev/null || true

      - name: Layer the pull requests on top
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PR_SPEC: ${{ needs.resolve.outputs.pr_spec }}
        run: |
          set -euo pipefail
          git config user.name 't3code-prs-nightly'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ref in ${PR_REFS}; do
            number="${ref#refs/pull/}"
            number="${number%/head}"
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              echo "::error::Unsupported pull request ref: ${ref}"
              exit 1
            fi
            git fetch --no-tags origin "+${ref}:refs/remotes/origin/pr-${number}"
            target="refs/remotes/origin/pr-${number}"
            echo "Merging ${ref} ($(git rev-parse --short "${target}"))"
            if git merge --no-edit "$target"; then
              continue
            fi

            # The pull request does not merge onto the nightly tag. It only
            # ships with a recorded resolution of the conflicting files: every
            # conflicted path is replaced by the resolved file checked into
            # resolutions/<number>/, and the recorded hashes prove both sides
            # are still the revisions that resolution was written against.
            resolutions="$RUNNER_TEMP/layers/resolutions/${number}"
            # A merge that fails before it records its parents did not produce
            # conflicts to resolve (a missing object, a refused ref), so the
            # resolutions below would paper over an unfinished merge.
            if [[ ! -f "$(git rev-parse --git-path MERGE_HEAD)" ]]; then
              echo "::error::Merging ${ref} failed before it produced a conflict. Read the git output above; nothing was committed."
              exit 1
            fi
            if [[ ! -f "${resolutions}/conflicts.tsv" ]]; then
              echo "::error::${ref} does not merge onto ${TAG} and resolutions/${number}/conflicts.tsv is missing."
              exit 1
            fi
            while read -r head_hash pr_hash path; do
              [[ -n "$path" ]] || continue
              actual_head="$(git show "HEAD:${path}" | sha256sum | cut -d' ' -f1)"
              actual_pr="$(git show "${target}:${path}" | sha256sum | cut -d' ' -f1)"
              if [[ "$actual_head" != "$head_hash" || "$actual_pr" != "$pr_hash" ]]; then
                echo "::error::The recorded resolution for ${path} is stale: the nightly tag or PR ${number} changed it. Resolve the conflict again and refresh resolutions/${number}/."
                exit 1
              fi
              install -Dpm0644 "${resolutions}/${path}" "${path}"
              git add "${path}"
              echo "Installed the recorded resolution for ${path}"
            done < "${resolutions}/conflicts.tsv"

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$unresolved" ]]; then
              echo "::error::PR ${number} conflicts in files with no recorded resolution:"
              echo "$unresolved"
              exit 1
            fi
            git commit --no-edit
          done
          echo "Built commit: $(git rev-parse HEAD)"
          echo "Expected pull requests: ${PR_SPEC}"

      - name: Apply local patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/layers/patches/"${FLAVOR}"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No local patches to apply."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying $(basename "${patch}")"
            if ! git apply --verbose "${patch}"; then
              echo "::error::Could not apply $(basename "${patch}"); the pull requests changed the files it touches."
              exit 1
            fi
          done
          git --no-pager diff --stat

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick

      - name: Install dependencies
        run: |
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      # The patches are the only part of this build upstream CI never sees, so
      # the focused test of the adapter they touch runs here before anything is
      # packaged. It needs the Command Code pull request in the layer set.
      - name: Test the Command Code adapter
        working-directory: apps/server
        run: |
          set -euo pipefail
          if [[ " ${PR_REFS} " != *" refs/pull/10861/head "* ]]; then
            echo "Pull request 10861 is not layered; skipping the Command Code adapter test."
            exit 0
          fi
          vp test run src/provider/Layers/CommandCodeAdapter.test.ts

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Build Linux AppImage
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage" || { echo "No AppImage was produced." >&2; exit 1; }
          install -Dm0755 "$appimage" \
            "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"
          ls -l "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: prs-appimage
          path: ${{ runner.temp }}/T3-Code-*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to COPR
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install RPM, release, and COPR tooling
        run: dnf --assumeyes install curl gh git jq rpm-build rpmdevtools copr-cli
      # The checkout is owned by the host user while run steps execute as a
      # different user inside the container, so `gh`'s internal git calls fail
      # without this.
      - name: Allow git access to the container-owned workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prs-appimage
          path: appimage

      # Archive the exact bytes the RPM carries before publishing anything that
      # claims to be built from them.
      - name: Archive the AppImage on a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="prs-nightly"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'T3 Code + pull requests nightly AppImages' \
              --notes 'Rolling prerelease holding the source-built AppImages that the t3code-prs-nightly RPM repackages.'
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "appimage/T3-Code-${VERSION}-x86_64.AppImage" --clobber

      - name: Build source RPM
        env:
          PR_SPEC: ${{ needs.resolve.outputs.pr_spec }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # `10861:<sha> 11973:<sha>` becomes the positional number/sha pairs
          # build-prs-srpm.sh records in the provenance file.
          pr_args=()
          for entry in ${PR_SPEC}; do
            pr_args+=("${entry%%:*}")
            pr_args+=("${entry#*:}")
          done
          ./scripts/build-layered-srpm.sh prs "$TAG" appimage/T3-Code-*.AppImage "${pr_args[@]}"

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 0700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

      - name: Submit source RPM to COPR
        env:
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$COPR_PROJECT"
          copr build "$COPR_PROJECT" rpmbuild/SRPMS/*.src.rpm

      - name: Record successful submission
        env:
          KEY: ${{ needs.resolve.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/record-last-built-key.sh "$FLAVOR" "$KEY"
