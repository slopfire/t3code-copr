name: Build T3 Code v2 orchestrator nightly

# Builds the v2 orchestrator branch (pull request #2829, which carries the Pi
# provider and the generic ACP registry) from source, packages the resulting
# x86_64 AppImage as `t3code-v2-nightly`, and submits it to the same COPR project
# as the plain nightly.
#
# Unlike the prs flavor, this one does not merge its pull requests onto the
# nightly tag. The branch is a rewrite of the orchestration layer that trails
# main, so merging it onto a newer nightly conflicts as soon as main moves past
# its base; the flavor therefore builds the branch head itself, which is the
# revision its author tests. There is no nightly tag to track either: the version
# and the build key come from that commit, and patches/v2/ carries what the
# main-side pull requests cannot provide here (the Command Code provider and the
# bundled Oh My Pi ACP entry, both written against the v2 interfaces).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this nightly tag and pull request revisions were already recorded
        required: false
        default: false
        type: boolean
      pr_refs:
        description: Space separated upstream pull request refs to layer, in merge order
        required: false
        default: refs/pull/2829/head
        type: string

permissions:
  contents: write

concurrency:
  group: t3code-v2-nightly-copr
  cancel-in-progress: false

env:
  T3CODE_REPO: pingdotgg/t3code
  # Flavor selects the spec template (t3code-<flavor>-nightly), the desktop
  # entry, and the patch directory (patches/<flavor>).
  FLAVOR: v2
  # The layered pull requests, in merge order. A ref is `refs/pull/<number>/head`
  # and the number must be the pull request the AppImage is built from.
  PR_REFS: ${{ inputs.pr_refs || 'refs/pull/2829/head' }}
  # The public identifiers upstream bakes into official builds (see its
  # .env.example). Not secrets: they only enable T3 Connect against the public
  # production deployment, and without them the app builds with cloud disabled.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  resolve:
    name: Resolve the upstream nightly and the pull request revisions
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      # The pinned orchestrator commit this build is made from.
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      # `10861:<sha> 11973:<sha>`, in merge order.
      pr_spec: ${{ steps.release.outputs.pr_spec }}
      key: ${{ steps.release.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve versions
        id: release
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No nightly tag here: this flavor's source is the branch head the pull
          # requests resolve to. The synthetic tag below keeps the spec renderer's
          # interface intact and moves only when that commit does.
          tag=""
          version=""

          pr_spec=""
          sha_key=""
          for ref in ${PR_REFS}; do
            number="${ref#refs/pull/}"
            number="${number%/head}"
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              echo "Unsupported pull request ref: ${ref}" >&2
              exit 1
            fi
            sha="$(gh api "repos/${T3CODE_REPO}/pulls/${number}" --jq '.head.sha')"
            test -n "$sha" || { echo "Could not resolve PR ${number}." >&2; exit 1; }
            pr_spec+="${pr_spec:+ }${number}:${sha}"
            sha_key+="+${sha}"
          done
          test -n "$pr_spec" || { echo "No pull requests to layer." >&2; exit 1; }
          # The first ref is this flavor's source: the orchestrator branch head.
          sha="${pr_spec%% *}"
          sha="${sha#*:}"
          # The base version still comes from upstream's latest nightly, so the
          # package version stays recognisable. The stamp and the build key come
          # from the pinned commit instead, which is what this flavor tracks.
          base="$(./scripts/resolve-latest-nightly.sh)"
          base_version="${base#v}"
          base_version="${base_version%%-nightly.*}"
          test -n "$base_version" || {
            echo "Could not read the base version out of ${base}." >&2
            exit 1
          }
          committed="$(gh api "repos/${T3CODE_REPO}/commits/${sha}" --jq '.commit.committer.date')"
          test -n "$committed" || { echo "Could not read the commit date of ${sha}." >&2; exit 1; }
          stamp="${committed:0:4}${committed:5:2}${committed:8:2}.${sha:0:12}"
          version="${base_version}-nightly.${stamp}"
          tag="v${version}"
          echo "Pinned source: ${sha} (${tag}, base version from ${base})"

          # Local patches and conflict resolutions ride on top of the pull
          # requests, so the key has to move when they change; otherwise a fixed
          # patch or resolution never rebuilds. Only this flavor's own patch
          # directory and the resolutions of its pull requests count.
          layer_paths=()
          [[ -d "patches/${FLAVOR}" ]] && layer_paths+=("patches/${FLAVOR}")
          for entry in ${pr_spec}; do
            number="${entry%%:*}"
            [[ -d "resolutions/${number}" ]] && layer_paths+=("resolutions/${number}")
          done
          if [[ ${#layer_paths[@]} -eq 0 ]]; then
            layer_digest="none"
          else
            layer_digest="$(find "${layer_paths[@]}" -type f -print0 | sort -z \
              | xargs -0 -r cat | sha256sum | cut -c1-12)"
          fi
          # The key holds the base version, the pinned commit, and the layer
          # digest: an upstream nightly stamp alone must not trigger a rebuild.
          key="v${base_version}${sha_key}+p${layer_digest}"
          echo "Pull requests: ${pr_spec}"
          echo "Layer digest: p${layer_digest}"

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'pr_spec=%s\n' "$pr_spec" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

          last="$(cat packaging/v2/last-built-key 2>/dev/null || true)"
          if [[ "$FORCE" == "true" || "$key" != "$last" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build (force=${FORCE} last=${last:-none})"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping; already recorded $key"
          fi

  build:
    name: Build the layered AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The pinned branch head. Full history keeps the checkout honest about the
      # commit it claims to build; a sparse checkout would make actions/checkout
      # fetch with `--filter=blob:none`, whose promisor fetch by object id fails
      # for revisions the branch carries.
      - name: Checkout the pinned orchestrator commit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.T3CODE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # This job checks out upstream, so the layer files that live in this
      # repository (patches/, resolutions/) are fetched by API rather than
      # checked out into the build tree.
      - name: Fetch the layer files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layers"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${{ github.sha }}" \
            | tar --extract --gzip --strip-components=1 --directory "$RUNNER_TEMP/layers"
          ls -R "$RUNNER_TEMP/layers/patches" "$RUNNER_TEMP/layers/resolutions" 2>/dev/null || true

      - name: Confirm the pinned orchestrator commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          PR_SPEC: ${{ needs.resolve.outputs.pr_spec }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          echo "Pinned commit: ${checked_out}"
          test "$checked_out" = "$SHA" || {
            echo "::error::Checked out ${checked_out}, expected ${SHA}."
            exit 1
          }
          # A wrong ref would otherwise build a tree that quietly lacks the
          # orchestrator and the providers this flavor exists for.
          test -f apps/server/src/orchestration-v2/ProviderAdapter.ts || {
            echo "::error::${SHA} is not the v2 orchestrator stack: orchestration-v2/ProviderAdapter.ts is missing."
            exit 1
          }
          echo "Source pull requests: ${PR_SPEC}"

      - name: Apply local patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/layers/patches/"${FLAVOR}"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No local patches to apply."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying $(basename "${patch}")"
            if ! git apply --verbose "${patch}"; then
              echo "::error::Could not apply $(basename "${patch}"); the pull requests changed the files it touches."
              exit 1
            fi
          done
          git --no-pager diff --stat

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick

      - name: Install dependencies
        run: |
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      # The patches are the only part of this build upstream CI never sees, so
      # the focused test of the adapter they touch runs here before anything is
      # packaged. It needs the Command Code pull request in the layer set.
      - name: Test the v2 Command Code adapter
        working-directory: apps/server
        run: |
          set -euo pipefail
          tests=(
            src/orchestration-v2/Adapters/CommandCodeAdapterV2.test.ts
            src/provider/commandCodeNdjson.test.ts
            src/provider/commandCodeModels.test.ts
          )
          for test in "${tests[@]}"; do
            [[ -f "$test" ]] || {
              echo "::error::${test} is missing: the Command Code patch did not apply."
              exit 1
            }
          done
          # The workspace binary matches this tree's vite-plus; the globally
          # installed vp version does not and fails every test file at import.
          vp_bin=../node_modules/.bin/vp
          [[ -x "$vp_bin" ]] || vp_bin=vp
          "$vp_bin" test run "${tests[@]}"

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Build Linux AppImage
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage" || { echo "No AppImage was produced." >&2; exit 1; }
          install -Dm0755 "$appimage" \
            "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"
          ls -l "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: v2-appimage
          path: ${{ runner.temp }}/T3-Code-*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to COPR
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install RPM, release, and COPR tooling
        run: dnf --assumeyes install curl gh git jq rpm-build rpmdevtools copr-cli
      # The checkout is owned by the host user while run steps execute as a
      # different user inside the container, so `gh`'s internal git calls fail
      # without this.
      - name: Allow git access to the container-owned workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v2-appimage
          path: appimage

      # Archive the exact bytes the RPM carries before publishing anything that
      # claims to be built from them.
      - name: Archive the AppImage on a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="v2-nightly"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'T3 Code v2 orchestrator nightly AppImages' \
              --notes 'Rolling prerelease holding the source-built AppImages that the t3code-v2-nightly RPM repackages.'
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "appimage/T3-Code-${VERSION}-x86_64.AppImage" --clobber

      - name: Build source RPM
        env:
          PR_SPEC: ${{ needs.resolve.outputs.pr_spec }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # `10861:<sha> 11973:<sha>` becomes the positional number/sha pairs
          # build-prs-srpm.sh records in the provenance file.
          pr_args=()
          for entry in ${PR_SPEC}; do
            pr_args+=("${entry%%:*}")
            pr_args+=("${entry#*:}")
          done
          ./scripts/build-layered-srpm.sh v2 "$TAG" appimage/T3-Code-*.AppImage "${pr_args[@]}"

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 0700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

      - name: Submit source RPM to COPR
        env:
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$COPR_PROJECT"
          copr build "$COPR_PROJECT" rpmbuild/SRPMS/*.src.rpm

      - name: Record successful submission
        env:
          KEY: ${{ needs.resolve.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Container checkouts can be source archives without a .git directory.
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git init
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            git branch -M main
          fi
          mkdir -p packaging/v2
          printf '%s\n' "$KEY" > packaging/v2/last-built-key
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/v2/last-built-key
          if git diff --cached --quiet; then
            echo "v2 nightly $KEY is already recorded"
            exit 0
          fi
          git commit -m "chore: record T3 Code v2 nightly $KEY"
          git push
