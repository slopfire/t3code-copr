name: Build T3 Code v2 orchestrator nightly

# Builds the upstream nightly from source and packages the resulting x86_64
# AppImage as `t3code-v2-nightly`, submitting it to the same COPR project as
# the plain nightly.
#
# The flavor exists because the v2 orchestrator stack (Pi provider, ACP
# registry) first shipped inside pull request #2829, which this repository
# packaged before upstream merged it. Upstream merged #2829 into main on
# 2026-10-02, so v2 is now plain main; the flavor stays because its users are
# already tracking the package name and because its build has to be verified
# separately (the AppImage is compiled here, not repackaged).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this nightly tag was already recorded
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: t3code-v2-nightly-copr
  cancel-in-progress: false

env:
  T3CODE_REPO: pingdotgg/t3code
  # Flavor selects the packaging notes and the desktop entry
  # (packaging/t3code-<flavor>.desktop); the spec template is shared.
  FLAVOR: v2
  # The public identifiers upstream bakes into official builds (see its
  # .env.example). Not secrets: they only enable T3 Connect against the public
  # production deployment, and without them the app builds with cloud disabled.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  resolve:
    name: Resolve the upstream nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      key: ${{ steps.release.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve versions
        id: release
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(./scripts/resolve-latest-nightly.sh)"
          version="${tag#v}"
          # No pull requests and no local patches: the key moves with the tag.
          key="${tag}"
          echo "Resolved upstream nightly: $tag"

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

          last="$(cat "packaging/${FLAVOR}/last-built-key" 2>/dev/null || true)"
          if [[ "$FORCE" == "true" || "$key" != "$last" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build (force=${FORCE} last=${last:-none})"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping; already recorded $key"
          fi

  build:
    name: Build the AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole object store has to be present: any later step that checks out
      # another revision (or a future layering step) reads blobs by object id,
      # and a sparse checkout's `--filter=blob:none` promisor fetch by object id
      # fails for revisions the tree does not carry.
      - name: Checkout upstream at the nightly tag
        uses: actions/checkout@v5
        with:
          repository: ${{ env.T3CODE_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Confirm the checkout
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Checked out tag: ${TAG} at $(git rev-parse HEAD)"
          # A wrong ref would otherwise build a tree without the orchestrator
          # and its providers, quietly stripping the flavor's reason to exist.
          test -f apps/server/src/orchestration-v2/ProviderAdapter.ts || {
            echo "::error::${TAG} is not the v2 orchestrator stack: orchestration-v2/ProviderAdapter.ts is missing."
            exit 1
          }

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick

      - name: Install dependencies
        run: |
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Build Linux AppImage
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage" || { echo "No AppImage was produced." >&2; exit 1; }
          install -Dm0755 "$appimage" \
            "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"
          ls -l "$RUNNER_TEMP/T3-Code-${{ needs.resolve.outputs.version }}-x86_64.AppImage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: v2-appimage
          path: ${{ runner.temp }}/T3-Code-*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to COPR
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install RPM, release, and COPR tooling
        run: dnf --assumeyes install curl gh git jq rpm-build rpmdevtools copr-cli
      # The checkout is owned by the host user while run steps execute as a
      # different user inside the container, so `gh`'s internal git calls fail
      # without this.
      - name: Allow git access to the container-owned workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v2-appimage
          path: appimage

      # Archive the exact bytes the RPM carries before publishing anything that
      # claims to be built from them.
      - name: Archive the AppImage on a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="v2-nightly"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'T3 Code v2 orchestrator nightly AppImages' \
              --notes 'Rolling prerelease holding the source-built AppImages that the t3code-v2-nightly RPM repackages.'
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "appimage/T3-Code-${VERSION}-x86_64.AppImage" --clobber

      - name: Build source RPM
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # No pull requests are layered, so no positional number/sha pairs are
          # passed to build-layered-srpm.sh.
          ./scripts/build-layered-srpm.sh v2 "$TAG" appimage/T3-Code-*.AppImage

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 0700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

      - name: Submit source RPM to COPR
        env:
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$COPR_PROJECT"
          copr build "$COPR_PROJECT" rpmbuild/SRPMS/*.src.rpm

      - name: Record successful submission
        env:
          KEY: ${{ needs.resolve.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/record-last-built-key.sh "$FLAVOR" "$KEY"
