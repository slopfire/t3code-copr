name: RPM packaging CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git for checkout
        run: dnf --assumeyes install git curl jq
      - uses: actions/checkout@v5
      - name: Install RPM tooling
        run: dnf --assumeyes install rpm-build rpmdevtools
      - name: Render and validate the RPM specs
        run: |
          ./scripts/render-spec.sh v0.0.46-nightly.20261003.2610 /tmp/t3code-nightly.spec
          rpmspec --parse /tmp/t3code-nightly.spec >/dev/null
          ./scripts/render-layered-spec.sh v2 \
            v0.0.46-nightly.20261003.2610 /tmp/t3code-v2-nightly.spec
          rpmspec --parse /tmp/t3code-v2-nightly.spec >/dev/null
          ./scripts/render-layered-spec.sh v2-prs \
            v0.0.46-nightly.20261003.2610 /tmp/t3code-v2-prs-nightly.spec
          rpmspec --parse /tmp/t3code-v2-prs-nightly.spec >/dev/null
      - name: Check shell scripts
        run: bash -n scripts/*.sh packaging/t3code
      - name: Check the patch set applies to the latest nightly
        if: hashFiles('patches/**') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every patch must apply to the upstream nightly tree it is layered
          # on, so a stale patch fails packaging CI instead of the COPR build
          # hours later. The touched flavors' patch directories are replayed
          # against the newest nightly tag in order.
          tag="$(./scripts/resolve-latest-nightly.sh)"
          scratch="$(mktemp -d)"
          git clone --quiet --no-checkout "https://github.com/${T3CODE_REPO:-pingdotgg/t3code}" "$scratch/upstream"
          git -C "$scratch/upstream" checkout --quiet "$tag"
          shopt -s nullglob
          for patch_dir in patches/*/; do
            flavor="$(basename "$patch_dir")"
            patches=("${patch_dir%/}"/*.patch)
            if [ ${#patches[@]} -eq 0 ]; then
              continue
            fi
            echo "Checking ${#patches[@]} patch(es) of ${flavor} against ${tag}"
            git -C "$scratch/upstream" apply --check "${patches[@]}"
          done
          rm -rf "$scratch"
